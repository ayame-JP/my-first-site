<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介 - ayame</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="shortcut icon" type="image/png" href="assets/icon.png">
    <link rel="apple-touch-icon" href="assets/icon.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --pink-primary: #EC4899;
            --pink-light: #F9A8D4;
            --pink-soft: #FBCFE8;
            --pink-bg: #FDF2F8;
            --white: #FFFFFF;
        }
        
        body {
            font-family: 'M PLUS Rounded 1c', 'Noto Sans JP', 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background: linear-gradient(180deg, #FFFFFF 0%, #FDF2F8 50%, #FCE7F3 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
            overflow-y: auto;
            overflow-x: hidden;
        }
        
        .container {
            background: #FFFFFF;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(236, 72, 153, 0.2);
            box-shadow: 
                0 4px 24px rgba(236, 72, 153, 0.08),
                0 1px 0 rgba(255, 255, 255, 0.9) inset;
            max-width: 700px;
            width: 100%;
            padding: 50px 40px;
            margin: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.8s ease-out;
            transition: all 0.3s ease;
        }
        
        .container:hover {
            box-shadow: 
                0 12px 40px rgba(236, 72, 153, 0.12),
                0 1px 0 rgba(255, 255, 255, 0.9) inset;
            border-color: rgba(236, 72, 153, 0.35);
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .profile-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 30px;
        }
        
        .profile-image {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #FBCFE8;
            margin: 0 auto;
            display: block;
            box-shadow: 
                0 8px 32px rgba(236, 72, 153, 0.15),
                0 0 0 1px rgba(236, 72, 153, 0.1);
            background: #FDF2F8;
            transition: all 0.3s ease;
            position: relative;
            z-index: 2;
        }
        
        .profile-image:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 40px rgba(236, 72, 153, 0.2);
            border-color: #F9A8D4;
        }
        
        .profile-image::before,
        .profile-image::after {
            display: none;
        }
        
        .profile-placeholder {
            width: 220px;
            height: 220px;
            border-radius: 50%;
            border: 4px solid #FBCFE8;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #FDF2F8 0%, #FBCFE8 100%);
            color: #EC4899;
            font-size: 64px;
            font-weight: 900;
            box-shadow: 0 8px 32px rgba(236, 72, 153, 0.12);
            transition: all 0.3s ease;
            position: relative;
        }
        
        .profile-placeholder:hover {
            transform: scale(1.03);
            box-shadow: 0 12px 40px rgba(236, 72, 153, 0.18);
        }
        
        :root {
            --font-scale-name: 1;
            --font-scale-h1: 1;
            --font-scale-h2: 1;
            --font-scale-quote: 1;
            --font-scale-author: 1;
            --font-scale-tag: 1;
            --font-scale-button: 1;
        }
        
        h1 {
            color: #1F2937;
            font-size: calc(32px * var(--font-scale-h1));
            margin-bottom: 15px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        
        .name {
            color: #EC4899;
            font-size: calc(56px * var(--font-scale-name));
            margin-bottom: 40px;
            font-weight: 800;
            letter-spacing: 2px;
            position: relative;
            display: inline-block;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        
        .name::before {
            display: none;
        }
        
        .name::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: #EC4899;
            border-radius: 2px;
        }
        
        .section {
            margin: 35px 0;
            padding: 30px;
            background: #FDF2F8;
            border-radius: 16px;
            text-align: left;
            border: 1px solid rgba(236, 72, 153, 0.15);
            box-shadow: 0 1px 3px rgba(236, 72, 153, 0.06);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .section::before {
            display: none;
        }
        
        .section:hover {
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.1);
            border-color: rgba(236, 72, 153, 0.25);
        }
        
        .section h2 {
            color: #EC4899;
            font-size: calc(26px * var(--font-scale-h2));
            margin-bottom: 20px;
            font-weight: 700;
            position: relative;
            padding-bottom: 12px;
            display: inline-block;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }
        
        .section h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 40px;
            height: 3px;
            background: #EC4899;
            border-radius: 2px;
        }
        
        .section p {
            color: #4B5563;
            font-size: 16px;
            line-height: 1.8;
        }
        
        .intro-text {
            color: #374151;
            font-size: 18px;
            line-height: 1.8;
            margin: 0;
            font-weight: 500;
        }
        
        .contact-block {
            margin-top: 36px;
            padding: 24px;
            text-align: center;
            border-top: 1px solid rgba(236, 72, 153, 0.2);
        }
        
        .contact-label {
            color: #6B7280;
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }
        
        .contact-email {
            color: #EC4899;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        .contact-email:hover {
            color: #DB2777;
            text-decoration: underline;
        }
        
        .hobbies {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        
        .hobby-tag {
            background: #EC4899;
            color: white;
            padding: 14px 28px;
            border-radius: 9999px;
            font-size: calc(15px * var(--font-scale-tag));
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(236, 72, 153, 0.25);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            font-family: 'M PLUS Rounded 1c', sans-serif;
            letter-spacing: 1px;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .hobby-tag::before {
            display: none;
        }
        
        .hobby-tag::after {
            display: none;
        }
        
        .hobby-tag:hover {
            transform: translateY(-2px);
            background: #DB2777;
            box-shadow: 0 4px 16px rgba(236, 72, 153, 0.35);
        }
        
        .hobby-tag:hover::before {
            width: 400px;
            height: 400px;
        }
        
        .hobby-tag:hover::after {
            opacity: 1;
        }
        
        .hobby-tag span {
            position: relative;
            z-index: 1;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        
        .social-links {
            margin: 30px 0;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        
        .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #EC4899;
            color: white;
            text-decoration: none;
            font-size: 24px;
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.3);
            transition: all 0.3s ease;
        }
        
        .social-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
            background: #DB2777;
        }
        
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }
            
            .container {
                padding: 30px 20px;
                margin: 10px;
                border-radius: 25px;
            }
            
            .profile-image,
            .profile-placeholder {
                width: 150px;
                height: 150px;
            }
            
            h1 {
                font-size: 24px;
                letter-spacing: 2px;
            }
            
            .name {
                font-size: 40px;
                letter-spacing: 2px;
            }
            
            .section {
                padding: 20px;
                margin: 25px 0;
            }
            
            .section h2 {
                font-size: 22px;
            }
            
            .social-link {
                width: 50px;
                height: 50px;
            }
            
            .rhythm-game-container {
                padding: 20px;
                margin: 40px auto 20px;
            }
            
            .game-lane {
                height: 300px;
            }
            
            .game-title {
                font-size: 22px;
            }
            
            .game-score {
                font-size: 16px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
                margin: 5px;
            }
            
            .profile-image,
            .profile-placeholder {
                width: 120px;
                height: 120px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            .name {
                font-size: 32px;
            }
            
            .section {
                padding: 15px;
            }
            
            .section h2 {
                font-size: 20px;
            }
            
            .rhythm-game-container {
                padding: 15px;
            }
            
            .game-lane {
                height: 250px;
            }
            
            .game-lane-container {
                gap: 5px;
            }
            
            .lane-label {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="profile-wrapper">
            <img src="assets/icon.png" alt="プロフィール写真" class="profile-image" 
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <div class="profile-placeholder" style="display: none;">古</div>
        </div>
        <h1>自己紹介</h1>
        <div class="name">ayame</div>
        
        <div class="section section-intro">
            <p class="intro-text">ta9nのクリエイティブエクスプローラー<br>SNS運用 WEB プログラミングまで多彩なツールを装備中</p>
        </div>
        
        <div class="contact-block">
            <p class="contact-label">お問合せはこちらまで</p>
            <a href="mailto:ayame2572@gmail.com" class="contact-email">ayame2572@gmail.com</a>
        </div>
    </div>
    
    <script>
        // スクロールアニメーション
        const observerOptions = {
            threshold: 0.1,
            rootMargin: '0px 0px -50px 0px'
        };
        
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);
        
        document.querySelectorAll('.section, .contact-block').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(30px)';
            el.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
            observer.observe(el);
        });
        
    </script>
    
    <script>
        // リズムゲーム
        let gameRunning = false;
        let gameScore = 0;
        let noteInterval = null;
        let noteSpeed = 2000; // ノートが落ちる速度（ミリ秒）
        const hitZone = 80; // ヒット判定の範囲（px）
        
        function startGame() {
            if (gameRunning) return;
            
            gameRunning = true;
            gameScore = 0;
            document.getElementById('score').textContent = '0';
            document.querySelector('.game-start-button').style.display = 'none';
            document.querySelector('.game-stop-button').style.display = 'inline-block';
            
            // ノートを生成
            noteInterval = setInterval(() => {
                if (!gameRunning) return;
                createNote();
            }, 800);
            
            // キーボードイベント
            document.addEventListener('keydown', handleKeyPress);
        }
        
        function stopGame() {
            gameRunning = false;
            if (noteInterval) {
                clearInterval(noteInterval);
            }
            document.querySelector('.game-start-button').style.display = 'inline-block';
            document.querySelector('.game-stop-button').style.display = 'none';
            document.removeEventListener('keydown', handleKeyPress);
            
            // 残っているノートを削除
            document.querySelectorAll('.note').forEach(note => note.remove());
        }
        
        function createNote() {
            const lanes = document.querySelectorAll('.game-lane');
            const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
            const laneArea = randomLane.querySelector('.lane-area');
            
            const note = document.createElement('div');
            note.className = 'note';
            note.style.animationDuration = noteSpeed + 'ms';
            laneArea.appendChild(note);
            
            // ノートが画面外に出たら削除
            setTimeout(() => {
                if (note.parentNode && !note.classList.contains('hit') && !note.classList.contains('miss')) {
                    note.remove();
                }
            }, noteSpeed);
        }
        
        function handleKeyPress(event) {
            const key = event.key.toLowerCase();
            const lanes = {
                'a': 0,
                's': 1,
                'd': 2,
                'f': 3
            };
            
            if (!lanes.hasOwnProperty(key)) return;
            
            const laneIndex = lanes[key];
            const lane = document.querySelectorAll('.game-lane')[laneIndex];
            const laneArea = lane.querySelector('.lane-area');
            const notes = laneArea.querySelectorAll('.note');
            
            // レーンをハイライト
            lane.classList.add('active');
            setTimeout(() => lane.classList.remove('active'), 150);
            
            // ヒット判定
            let hit = false;
            notes.forEach(note => {
                const noteTop = note.getBoundingClientRect().top;
                const hitLineTop = lane.querySelector('.lane-area').getBoundingClientRect().bottom - hitZone;
                
                if (noteTop >= hitLineTop - 30 && noteTop <= hitLineTop + 30 && !note.classList.contains('hit') && !note.classList.contains('miss')) {
                    note.classList.add('hit');
                    note.style.animation = 'none';
                    gameScore += 10;
                    document.getElementById('score').textContent = gameScore;
                    hit = true;
                    setTimeout(() => note.remove(), 300);
                }
            });
            
            // ミス判定（該当レーンにノートがない場合）
            if (!hit && notes.length > 0) {
                const closestNote = Array.from(notes).reduce((closest, note) => {
                    const noteTop = note.getBoundingClientRect().top;
                    const hitLineTop = lane.querySelector('.lane-area').getBoundingClientRect().bottom - hitZone;
                    const closestTop = closest ? closest.getBoundingClientRect().top : Infinity;
                    return Math.abs(noteTop - hitLineTop) < Math.abs(closestTop - hitLineTop) ? note : closest;
                }, null);
                
                if (closestNote) {
                    const noteTop = closestNote.getBoundingClientRect().top;
                    const hitLineTop = lane.querySelector('.lane-area').getBoundingClientRect().bottom - hitZone;
                    if (Math.abs(noteTop - hitLineTop) > 50) {
                        closestNote.classList.add('miss');
                        setTimeout(() => closestNote.remove(), 300);
                    }
                }
            }
        }
    </script>
</body>
